<!DOCTYPE html>
<html lang="hi"><head><meta charset="utf-8"><title>उड़ान (Udaan)</title>

<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700&family=Yatra+One&display=swap" rel="stylesheet">
<style>
:root{--ink:#17203A;--paper:#F4F2F8;--card:#fff;--line:#DDD8E8;--mute:#5E6783;--red:#E8505B;--sun:#F6B01E;--leaf:#1E8C6E;--sky:#2F6FD0;--bg:#C9D6EE;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#ECEBF7;--paper:#121629;--card:#1B2140;--line:#2F3760;--mute:#9AA3C7;--bg:#0A0D1C}}
:root[data-theme="dark"]{--ink:#ECEBF7;--paper:#121629;--card:#1B2140;--line:#2F3760;--mute:#9AA3C7;--bg:#0A0D1C}
*{box-sizing:border-box;margin:0}html,body{height:100%}
body{font-family:Mukta,"Noto Sans Devanagari",system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:15px;line-height:1.45}
h1,h2,h3{font-family:"Yatra One",Mukta,serif;font-weight:400;line-height:1.2}
.phone{width:400px;height:min(840px,100%);background:var(--paper);border-radius:30px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 18px 50px rgba(20,30,70,.28);position:relative}
@media(max-width:480px){.phone{width:100%;height:100%;border-radius:0}}
.body{flex:1;overflow-y:auto;padding:0 16px 20px}
.hd{margin:0 -16px 14px;padding:16px 16px 0;background:linear-gradient(#FBD9A8,#F6E7D0 60%,var(--paper));position:relative}
:root[data-theme="dark"] .hd{background:linear-gradient(#2A2F63,#1C2248 70%,var(--paper))}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .hd{background:linear-gradient(#2A2F63,#1C2248 70%,var(--paper))}}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pill{border:1.5px solid var(--ink);background:transparent;color:var(--ink);border-radius:99px;padding:5px 12px;font:600 13px Mukta,sans-serif;cursor:pointer}
.pill.on{background:var(--ink);color:var(--paper)}
.btn{background:var(--red);color:#fff;border:0;border-radius:14px;padding:13px 18px;font:700 16px Mukta,sans-serif;cursor:pointer;width:100%}
.btn.alt{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.card.tap{cursor:pointer;width:100%;text-align:left;font:inherit;color:inherit;display:block}
.mute{color:var(--mute);font-size:13px}
h2{font-size:21px;margin:6px 0 4px}h3{font-size:17px;margin:14px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:9px 13px;font:600 15px Mukta,sans-serif;cursor:pointer}
.chip.on{border-color:var(--red);background:var(--red);color:#fff}
.scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin:0 -16px;padding-left:16px;padding-right:16px}
.scroll .chip{white-space:nowrap}
.bub{max-width:82%;padding:10px 13px;border-radius:16px;margin:8px 0;background:var(--card);border:1px solid var(--line)}
.bub.me{margin-left:auto;background:var(--sky);color:#fff;border-color:var(--sky)}
.mic{width:68px;height:68px;border-radius:50%;border:0;background:var(--red);display:grid;place-items:center;margin:10px auto 2px;cursor:pointer;position:relative}
.mic.on::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:3px solid var(--red);animation:rp 1s infinite}
@keyframes rp{from{transform:scale(.85);opacity:1}to{transform:scale(1.25);opacity:0}}
.wave{display:flex;gap:4px;justify-content:center;align-items:center;height:34px}
.wave i{width:5px;background:var(--red);border-radius:3px;animation:wv .7s infinite alternate}
.wave i:nth-child(2n){animation-delay:.2s}.wave i:nth-child(3n){animation-delay:.35s}
@keyframes wv{from{height:6px}to{height:30px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
.nav{display:flex;border-top:1px solid var(--line);background:var(--card)}
.nav button{flex:1;border:0;background:none;padding:9px 0 8px;color:var(--mute);font:600 12px Mukta,sans-serif;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.nav button.on{color:var(--red)}
.nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.lad{list-style:none;padding:0;margin:8px 0 14px 8px;border-left:2px dashed var(--mute)}
.lad li{position:relative;padding:0 0 14px 20px;cursor:pointer}
.lad li::before{content:"";position:absolute;left:-9px;top:3px;width:16px;height:16px;border-radius:3px;transform:rotate(45deg);background:var(--c)}
.lad b{display:block}
.tile{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;flex:none}
.tile svg{width:26px;height:26px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.row{display:flex;gap:12px;align-items:center}
.bar{height:7px;border-radius:4px;background:var(--line);margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--leaf)}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:8px;padding:2px 8px;margin:4px 6px 0 0;background:var(--line);color:var(--ink)}
.tag.g{background:var(--leaf);color:#fff}.tag.b{background:var(--sky);color:#fff}.tag.y{background:var(--sun);color:#17203A}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{text-align:left;padding:8px 4px;border-bottom:1px solid var(--line)}
.src{font-size:12px;color:var(--mute);margin-top:6px}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat .card{margin:0}.stat b{font:400 26px "Yatra One",serif;display:block}
.spk{display:inline-flex;align-items:center;gap:5px;border:1.5px solid var(--sky);color:var(--sky);background:transparent;border-radius:99px;padding:3px 10px;font:600 13px Mukta,sans-serif;cursor:pointer;margin-left:8px}
.spk svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.more{font-size:13px;font-weight:700;color:var(--red);margin-top:6px}
.scn{width:100%;border-radius:16px;display:block;margin-bottom:12px}
.stp{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}.stp .tile{background:var(--sky);width:40px;height:40px}.stp b{display:block}
.chk{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border:0;border-bottom:1px solid var(--line);cursor:pointer;width:100%;background:none;text-align:left;font:inherit;color:inherit}
.chk i{flex:none;width:22px;height:22px;border:2px solid var(--mute);border-radius:6px;display:grid;place-items:center;font-style:normal;color:#fff}
.chk.on i{background:var(--leaf);border-color:var(--leaf)}
.top>span{display:flex;gap:6px}.m3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.m3 div{border-radius:12px;padding:8px;color:#17203A;font-size:13px}

function pick(i,v){const s=ST[S.step];if(s.multi){const a=S.p.ints,j=a.indexOf(v);j<0?a.push(v):a.splice(j,1);S.ans.ints=a.map(x=>t(s.o.find(o=>o[2]===x).slice(0,2))).join(', ');R();return}
const o=s.o[i];S.ans[s.k]=o.slice(0,2);if(s.k==='field')S.p.field=v==='?'?'':v;else if(s.k==='urg')S.p.urg=v==='1';else S.p[s.k]=v;next()}
function next(){S.step++;if(S.step>=ST.length){S.p.field=S.p.field||car()[0].f||'trade';S.field=S.p.field||'trade';S.scr='app';S.tab='home'}R()}
function mic(){if(S.listen)return;S.listen=true;R();setTimeout(()=>{S.listen=false;const s=ST[S.step];if(s.multi){S.p.ints=s.d.map(i=>s.o[i][2]);S.ans.ints=s.d.map(i=>t(s.o[i].slice(0,2))).join(', ');next()}else pick(s.d,s.o[s.d][2])},1500)}
function ob(){const s=ST[S.step],done=ST.slice(0,S.step);
const hist=done.map(d=>`<div class="bub">${t(d.q)}</div><div class="bub me">${d.multi?S.ans.ints:t(S.ans[d.k])}</div>`).join('');
const chips=s.o.map((o,i)=>`<button class="chip ${s.multi&&S.p.ints.includes(o[2])?'on':''}" onclick="pick(${i},'${o[2]}')">${t(o.slice(0,2))}</button>`).join('');
return`<div class="body"><div class="hd">${hero(100)}<div class="top" style="margin-top:8px"><button class="pill" onclick="bk()">‹ ${t(['वापस','Back'])}</button><b>${t(['चरण','Step'])} ${S.step+1}/${ST.length}</b><button class="pill" onclick="setLang()">${S.lang==='hi'?'English':'हिंदी'}</button></div><div class="bar"><i style="width:${(S.step+1)/ST.length*100}%"></i></div></div>${hist}<div class="bub">${t(s.q)}${spk(t(s.q))}</div><div class="chips">${chips}</div>${s.multi?`<button class="btn" onclick="next()" ${S.p.ints.length?'':'disabled style="opacity:.5"'}>${t(['आगे बढ़ें','Continue'])}</button>`:''}
<button class="mic ${S.listen?'on':''}" onclick="mic()" aria-label="${t(['बोलकर जवाब दें','Answer by voice'])}"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg></button>
${S.listen?`<div class="wave" aria-live="polite">${'<i></i>'.repeat(9)}</div><p class="mute" style="text-align:center">${t(['सुन रहा हूँ…','Listening…'])}</p>`:`<p class="mute" style="text-align:center">${t(['बोलकर जवाब दें (डेमो में अपने आप चुन लेगा)','Tap to answer by voice (demo picks for you)'])}</p>`}</div>`}
function splash(){return`<div class="body" style="display:flex;flex-direction:column;padding:0"><div style="flex:none">${hero(330)}</div><div style="padding:6px 22px 24px;margin-top:-6px"><h1 style="font-size:54px;color:var(--red)">${t(['उड़ान','Udaan'])}</h1><p style="font-size:17px;margin:6px 0 18px">${t(['आपकी पढ़ाई, आपका करियर, आपकी कमाई। एक ही योजना में, आपकी अपनी भाषा में।','Your studies, your career, your income. One plan, in your own language.'])}</p><button class="btn" onclick="start('hi')">हिंदी में शुरू करें</button><button class="btn alt" style="margin-top:10px" onclick="start('en')">Start in English</button><p class="mute" style="margin-top:12px">${t(['बेसिक फ़ोन? मिस्ड कॉल या WhatsApp से भी जुड़ सकते हैं।','Basic phone? Join by missed call or WhatsApp too.'])}</p></div></div>`}
function home(){const c=car()[0],j=jobs()[0],e=EX[S.field]||EX.trade,sum=t(['आपकी उड़ान योजना। अभी कमाई शुरू करें: ','Your Udaan plan. Start earning: '])+(j?t(j.n):'')+t(['। अगले छह महीने तैयारी: ','. Next six months, prepare for: '])+e[0][0]+t(['। सबसे अच्छा करियर: ','. Best career match: '])+t(c.n)+'.';
if(S.fac){const R=[['रिंकू कुमारी','Rinku Kumari','12','स्वास्थ्य','Health',3],['अमन राज','Aman Raj','10','ITI','ITI',2],['सोनम खातून','Sonam Khatoon','12','क़ानून','Law',1],['दीपक पासवान','Deepak Paswan','11','इंजीनियरिंग','Engg',4],['प्रिया कुमारी','Priya Kumari','12','शिक्षण','Teaching',2]],L=[['प्रोफ़ाइल','Profile'],['शॉर्टलिस्ट','Shortlist'],['आवेदन','Applied'],['काम शुरू','Earning']];
return`<div class="body">${hdr(t(['शिक्षक मोड','Teacher mode']),t(['आपके 5 छात्र, एक नज़र में','Your 5 students at a glance']),90)}<div class="stat"><div class="card"><b>70%</b><span class="mute">${t(['प्रोफ़ाइल पूरी (लक्ष्य)','Profiles done (target)'])}</span></div><div class="card"><b>60%</b><span class="mute">${t(['रास्ता साफ़ (लक्ष्य)','Clear pathway (target)'])}</span></div></div><h3>${t(['छात्र','Students'])}</h3><div class="card"><table>${R.map(r=>`<tr><td><b>${S.lang==='hi'?r[0]:r[1]}</b><br><span class="mute">${t(['कक्षा','Class'])} ${r[2]}, ${S.lang==='hi'?r[3]:r[4]}</span></td><td style="text-align:right"><span class="tag ${r[5]>2?'g':'y'}">${t(L[r[5]-1])}</span></td></tr>`).join('')}</table></div><p class="mute">${t(['एक शिक्षक, कई छात्र: हर छात्र अपनी प्रोफ़ाइल से चलता है।','One teacher, many students. Each student runs on their own profile.'])}</p></div>`}
return`<div class="body">${hdr(t(['नमस्ते, आपकी उड़ान योजना तैयार है','Namaste, your Udaan plan is ready']),t(['आपकी जानकारी के हिसाब से बनी','Built from what you told us']),120)}
<p>${spk(sum)}</p><ul class="lad"><li style="--c:var(--sun)" onclick="go('earn')"><b>${t(['अभी: कमाई शुरू करें','Now: start earning'])}</b><span class="mute">${j?t(j.n)+', '+j.inc:t(['घंटे बढ़ाकर देखें','Try more hours'])}</span></li>
<li style="--c:var(--sky)" onclick="go('path')"><b>${t(['अगले 6 महीने: परीक्षा की तैयारी','Next 6 months: prepare for the exam'])}</b><span class="mute">${e[0][0]}</span></li>
<li style="--c:var(--red)" onclick="go('car')"><b>${t(['आगे: कॉलेज और पैसों का इंतज़ाम','Later: college and funding'])}</b><span class="mute">${t(c.n)}, ${elig()} ${t(['योजनाओं के पात्र','schemes you qualify for'])}</span></li></ul>
<div class="stat"><button class="card tap" onclick="go('car')"><b>${c.m}%</b><span class="mute">${t(['सबसे अच्छा मेल: ','Best match: '])}${t(c.n)}</span></button><button class="card tap" onclick="go('path')"><b>${elig()}</b><span class="mute">${t(['योजनाएं जिनके आप पात्र हैं','schemes you qualify for'])}</span></button></div>
<h3>${t(['हर जवाब का आधिकारिक स्रोत','Every answer shows its official source'])}</h3><p class="mute">${t(['नियम सत्यापित डेटा से तय होते हैं। AI सिर्फ़ समझाता है।','Rules come from verified data. The AI only explains.'])}</p></div>`}
function path(){const f=S.field,list=EX[f]||EX.trade;
return`<div class="body">${hdr(t(['परीक्षा और रास्ते','Exams and pathways']),t(['JEE-NEET के अलावा भी रास्ते हैं','There are routes beyond JEE and NEET']),100)}<div class="scroll">${FIELDS.map(x=>`<button class="chip ${f===x[2]?'on':''}" onclick="S.field='${x[2]}';R()">${t(x.slice(0,2))}</button>`).join('')}</div>
${list.map((x,i)=>`<div class="card tap" role="button" tabindex="0" onclick="det('ex',${i})"><b>${x[0]}</b><div>${x[3]?`<span class="tag y">${t(['JEE-NEET के अलावा','Beyond JEE and NEET'])}</span>`:`<span class="tag">${t(['लोकप्रिय परीक्षा','Popular exam'])}</span>`}</div><p style="margin-top:6px">${x[1]}</p><p class="src">${t(['स्रोत','Source'])}: ${x[2]}</p><p class="more">${t(['पूरी जानकारी और फ़ोटो देखें','See details and pictures'])}</p></div>`).join('')}
<h3>${t(['पैसों का इंतज़ाम','Funding for you'])}</h3>${SCH.map(s=>{const r=s.r(S.p),b=SB[r];return`<div class="card tap" role="button" tabindex="0" onclick="det('sc','${s.id}')" style="${r==='no'?'opacity:.6':''}"><div class="row" style="justify-content:space-between;align-items:flex-start"><b>${t(s.n)}</b><span class="tag ${b[1]}">${t(b[0])}</span></div><p style="margin-top:4px">${s.d}</p><p class="src">${t(['स्रोत','Source'])}: ${s.src}</p><p class="more">${t(['काग़ज़ात जाँचें','Check documents'])}: ${dn(s)}</p></div>`}).join('')}<p class="mute">${t(['नमूना डेटा: प्रकाशित करने से पहले आधिकारिक साइट से जाँचें।','Sample data. Verify on official sites before launch.'])}</p></div>`}
function cars(){return`<div class="body">${hdr(t(['आपके लिए करियर','Careers for you']),t(['आपकी पसंद और हालात के हिसाब से','Ranked by your interests and situation']),100)}${car().map(c=>{const o=S.open===c.id;return`<button class="card tap" onclick="S.open=${o?'null':`'${c.id}'`};R()"><div class="row"><div class="tile" style="background:${c.c}">${ic(c.s)}</div><div style="flex:1"><b>${t(c.n)}</b><div class="bar"><i style="width:${c.m}%;background:${c.c}"></i></div></div><b>${c.m}%</b></div>${o?`<div style="margin-top:12px"><p>${c.d}</p><p style="margin-top:6px"><b>${t(['कोर्स','Course'])}:</b> ${c.co}</p><p><b>${t(['परीक्षा','Exams'])}:</b> ${c.ex}</p><p><b>${t(['अगला कदम','Next step'])}:</b> ${c.nx}</p><span class="tag g">${elig()} ${t(['योजनाएं आपके लिए','schemes open to you'])}</span></div>`:''}</button>`}).join('')}</div>`}
function tl(j){const s=Math.min(3.2,j?j.wk/4.3:0.3);return`<svg viewBox="0 0 360 110" width="100%" role="img" aria-label="Earn and study timeline"><g font-size="11" fill="var(--mute)">${[1,2,3,4,5,6].map(m=>`<text x="${10+(m-1)*58}" y="12">${t(['माह','Mo'])} ${m}</text>`).join('')}</g>
<rect x="${10+s*58}" y="22" width="${Math.max(10,(4-s+1)*58)}" height="26" rx="8" fill="var(--sun)"/><text x="${18+s*58}" y="39" font-size="12" fill="#17203A" font-weight="700">${t(['कमाई','Earn'])}</text>
<rect x="10" y="58" width="348" height="26" rx="8" fill="var(--sky)"/><text x="18" y="75" font-size="12" fill="#fff" font-weight="700">${t(['पढ़ाई और तैयारी जारी','Study and prep continue'])}</text>
<path d="M300 94l8 10 8-10z" fill="var(--red)"/><text x="262" y="108" font-size="11" fill="var(--ink)">${t(['फ़ॉर्म भरें','Apply'])}</text></svg>`}
function earn(){const L=jobs();return`<div class="body">${hdr(t(['कमाई भी, पढ़ाई भी','Earn now, learn alongside']),t(['3-4 महीने में आमदनी, पढ़ाई बंद किए बिना','Income in 3 to 4 months without leaving studies']),100)}<b>${t(['रोज़ कितने घंटे दे सकते हैं?','Hours per day you can give'])}</b><div class="chips">${[[2,'2'],[4,'4'],[8,'6+']].map(h=>`<button class="chip ${S.hrs===h[0]?'on':''}" onclick="S.hrs=${h[0]};R(1)">${h[1]} ${t(['घंटे','hrs'])}</button>`).join('')}</div><div class="card">${tl(L[0])}</div>${plan(L)}
${L.map(j=>`<div class="card tap" role="button" tabindex="0" onclick="det('job',${JOBS.indexOf(j)})"><b>${t(j.n)}</b><div style="font:400 20px 'Yatra One',serif;margin:4px 0">${j.inc}</div><span class="tag ${j.st==='yes'?'g':j.st==='part'?'y':''}">${t(j.st==='yes'?['पढ़ाई के साथ आसान','Easy with studies']:j.st==='part'?['पढ़ाई के साथ कुछ मुश्किल','Tight with studies']:['पूरा समय चाहिए','Needs full time'])}</span><span class="tag b">${t(['शुरुआत','Starts in'])} ${j.wk} ${t(['हफ़्ते','wks'])}</span><p style="margin-top:6px"><b>${t(['ज़रूरी','Needs'])}:</b> ${j.rq}</p><p><b>${t(['कैसे जुड़ें','How to apply'])}:</b> ${j.ap}</p>${j.lk?`<p class="mute">${t(['आपके करियर से जुड़ा: ','Links to your path: '])}${t(CAR.find(c=>c.id===j.lk).n)}</p>`:''}<p class="more">${t(['पूरी जानकारी और फ़ोटो','Full details and pictures'])}</p></div>`).join('')||`<div class="card">${t(['इन घंटों में कोई काम नहीं। घंटे बढ़ाएं।','No jobs fit these hours. Try more hours.'])}</div>`}<p class="mute">${t(['नमूना आंकड़े: असली डेटा स्थानीय सत्यापन के बाद।','Sample figures. Real data after local verification.'])}</p></div>`}
function R(k){V=[];const a=$('#app'),o=a.querySelector('.body'),sc=o?o.scrollTop:0;if(S.scr==='splash'){a.innerHTML=splash();return}
if(S.scr==='ob'){a.innerHTML=ob();return}
const v=S.det?detail():{home,path,car:cars,earn}[S.tab]();a.innerHTML=v+`<nav class="nav">${NAV.map(n=>`<button class="${S.tab===n[0]?'on':''}" onclick="go('${n[0]}')"><svg viewBox="0 0 24 24"><path d="${n[2]}"/></svg>${t(n[1])}</button>`).join('')}</nav>`;
const b=a.querySelector('.body');if(b)b.scrollTop=k?sc:0}
R();
</script></body></html>
